[package]
name = "rget-cli"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "High-performance resumable download manager"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/rget"

# The crates.io name `rget` belongs to an unrelated 2017 crate, so the package
# is published as `rget-cli`. The library and the command it installs are both
# plain `rget`.
[lib]
name = "rget"
path = "src/lib.rs"

[[bin]]
name = "rget"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
    "io-util",
    "net",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
    "http2",
    "socks",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1"
url = "2"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
terminal_size = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
